name: Deploy DermoScan to Vercel

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: dermoscan-production
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: '64.5.0'
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./skin-cancer-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo '::error::Set VERCEL_ORG_ID for the intended DermoScan project.'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo '::error::Set VERCEL_PROJECT_ID for the intended DermoScan project.'; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo '::error::Configure the VERCEL_TOKEN repository secret, or deploy using the connected Vercel Git integration.'; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Deploy frontend and model together
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes
