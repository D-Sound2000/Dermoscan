[project]
name = "dermoscan-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "matplotlib==3.10.9",
  "numpy==2.4.6",
  "pillow==12.2.0",
  "python-multipart==0.0.29",
  "torch==2.12.0",
  "torchvision==0.27.0",
]

[project.scripts]
app = "api:app"

[tool.vercel]
entrypoint = "api:app"

# Cloud inference runs on CPU. Linux PyPI wheels otherwise pull several GB
# of CUDA libraries and exceed Vercel's Python function bundle limit.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
